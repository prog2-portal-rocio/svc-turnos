spring.application.name=svc-turnos

# Consultas a Catalogo con el JWT del usuario autenticado
turnos.catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8081}
turnos.catalogo.connect-timeout=${CATALOGO_CONNECT_TIMEOUT:3s}
turnos.catalogo.response-timeout=${CATALOGO_RESPONSE_TIMEOUT:5s}

spring.datasource.url=jdbc:postgresql://localhost:5433/turnos_db
spring.datasource.username=turnos_user
spring.datasource.password=${TURNOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

turnos.jwt.private-key-location=${TURNOS_JWT_PRIVATE_KEY_LOCATION}
turnos.jwt.public-key-location=${TURNOS_JWT_PUBLIC_KEY_LOCATION}
