spring.application.name=svc-turnos

# Consultas a Catalogo con el JWT del usuario autenticado
turnos.catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8081}
turnos.catalogo.connect-timeout=${CATALOGO_CONNECT_TIMEOUT:3s}
turnos.catalogo.response-timeout=${CATALOGO_RESPONSE_TIMEOUT:5s}

spring.datasource.url=jdbc:postgresql://localhost:5433/turnos_db
spring.datasource.username=turnos_user
spring.datasource.password=${TURNOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

turnos.jwt.private-key-location=${TURNOS_JWT_PRIVATE_KEY_LOCATION}
turnos.jwt.public-key-location=${TURNOS_JWT_PUBLIC_KEY_LOCATION}

# API de cátedra: JWT técnico distinto del JWT del usuario; no hay login automático.
turnos.catedra.base-url=${CATEDRA_BASE_URL:}
turnos.catedra.technical-token=${CATEDRA_TECHNICAL_TOKEN:}
turnos.catedra.connect-timeout=${CATEDRA_CONNECT_TIMEOUT:3s}
turnos.catedra.response-timeout=${CATEDRA_RESPONSE_TIMEOUT:5s}

# Topic compartido de reservas. Habilitar solo con la configuración de la integración técnica.
turnos.kafka.enabled=${KAFKA_LISTENER_AUTO_STARTUP:false}
turnos.kafka.actions-topic=${KAFKA_APPOINTMENT_ACTIONS_TOPIC:}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.auto-startup=${turnos.kafka.enabled}

# Salida de teléfono: valores asignados por integration, sin JWT de usuario en Kafka.
turnos.kafka.integration-group-id=${CATEDRA_GROUP_ID:}
turnos.kafka.phone-topic=${KAFKA_APPOINTMENT_PHONE_TOPIC:}
turnos.kafka.phone-publication-enabled=${KAFKA_PHONE_PUBLICATION_ENABLED:false}
turnos.kafka.phone-send-timeout=20s
turnos.kafka.outbox-poll-interval=5000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
