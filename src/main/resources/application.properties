spring.application.name=svc-turnos

spring.datasource.url=jdbc:postgresql://localhost:5433/turnos_db
spring.datasource.username=turnos_user
spring.datasource.password=${TURNOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

turnos.jwt.private-key-location=${TURNOS_JWT_PRIVATE_KEY_LOCATION}
turnos.jwt.public-key-location=${TURNOS_JWT_PUBLIC_KEY_LOCATION}
