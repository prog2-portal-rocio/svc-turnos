services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: turnos_db
      POSTGRES_USER: turnos_user
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD:?Definir TURNOS_DB_PASSWORD en .env o en el entorno}
    ports:
      - "127.0.0.1:${TURNOS_DB_PORT:-5433}:5432"
    volumes:
      - turnos_postgres_data:/var/lib/postgresql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  svc-turnos:
    build: .
    restart: unless-stopped
    networks:
      - default
      - integracion
    # Permite leer una privada 0600 del usuario host sin ampliar sus permisos.
    user: "${TURNOS_CONTAINER_UID:-10001}:${TURNOS_CONTAINER_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/turnos_db
      TURNOS_DB_PASSWORD: ${TURNOS_DB_PASSWORD:?Definir TURNOS_DB_PASSWORD en .env o en el entorno}
      TURNOS_JWT_PRIVATE_KEY_LOCATION: file:/run/keys/turnos-private.pem
      TURNOS_JWT_PUBLIC_KEY_LOCATION: file:/run/keys/turnos-public.pem
      CATALOGO_BASE_URL: ${CATALOGO_BASE_URL:-http://svc-catalogo:8080}
      CATALOGO_CONNECT_TIMEOUT: ${CATALOGO_CONNECT_TIMEOUT:-3s}
      CATALOGO_RESPONSE_TIMEOUT: ${CATALOGO_RESPONSE_TIMEOUT:-5s}
      CATEDRA_BASE_URL: ${CATEDRA_BASE_URL:-}
      CATEDRA_TECHNICAL_TOKEN: ${CATEDRA_TECHNICAL_TOKEN:-}
      CATEDRA_CONNECT_TIMEOUT: ${CATEDRA_CONNECT_TIMEOUT:-3s}
      CATEDRA_RESPONSE_TIMEOUT: ${CATEDRA_RESPONSE_TIMEOUT:-5s}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-}
      KAFKA_APPOINTMENT_ACTIONS_TOPIC: ${KAFKA_APPOINTMENT_ACTIONS_TOPIC:-}
      KAFKA_LISTENER_AUTO_STARTUP: ${KAFKA_LISTENER_AUTO_STARTUP:-false}
      CATEDRA_GROUP_ID: ${CATEDRA_GROUP_ID:-}
      KAFKA_APPOINTMENT_PHONE_TOPIC: ${KAFKA_APPOINTMENT_PHONE_TOPIC:-}
      KAFKA_PHONE_PUBLICATION_ENABLED: ${KAFKA_PHONE_PUBLICATION_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${TURNOS_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${TURNOS_JWT_PRIVATE_KEY_FILE:?Definir ruta absoluta de la clave privada RSA}
        target: /run/keys/turnos-private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TURNOS_JWT_PUBLIC_KEY_FILE:?Definir ruta absoluta de la clave publica RSA}
        target: /run/keys/turnos-public.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Solo HTTP/seguridad, sin ejecutar reservas ni consultar sistemas externos.
      test: ["CMD-SHELL", "test \"$$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:8080/api/reservas/holds)\" = 401"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  turnos_postgres_data:

networks:
  default: {}
  integracion:
    external: true
    name: backends-integracion
